spring:
  application:
    name: library-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library
    hikari:
      pool-name: library-pool
      maximum-pool-size: 10          # больше соединений не будет никогда
      connection-timeout: 30000      # сколько ждать свободное соединение, мс
      max-lifetime: 1800000          # соединение пересоздаётся раз в 30 минут
      data-source-properties:
        ApplicationName: library-demo  # видно в pg_stat_activity

  liquibase:
    change-log: classpath:changelog/changelog.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate             # схему создаёт Liquibase, Hibernate только проверяет
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug                 # каждый SQL, который выполняет Hibernate
    # org.hibernate.orm.jdbc.bind: trace     # значения параметров
    com.zaxxer.hikari.HikariConfig: debug    # итоговые настройки пула при старте
